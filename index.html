<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sendly: Direct P2P Transfer</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:480px;padding:20px}
.logo{text-align:center;margin-bottom:30px}
.logo h1{font-size:2.2rem;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
.logo p{color:#888;font-size:0.9rem}
.tabs{display:flex;gap:10px;margin-bottom:25px}
.tab{flex:1;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.3s}
.tab.send{background:#1a1a2e;color:#667eea}
.tab.receive{background:#1a1a2e;color:#764ba2}
.tab.active.send{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.tab.active.receive{background:linear-gradient(135deg,#764ba2,#667eea);color:#fff}
.panel{display:none;background:#12121a;border-radius:16px;padding:30px;border:1px solid #1e1e2e}
.panel.active{display:block}
.code-display{background:#1a1a2e;border-radius:12px;padding:20px;text-align:center;margin:20px 0;font-size:2.5rem;font-weight:700;letter-spacing:8px;color:#667eea}
.input-group{margin:15px 0}
.input-group input{width:100%;padding:14px 18px;border-radius:10px;border:2px solid #2a2a3e;background:#1a1a2e;color:#fff;font-size:1rem;outline:none;transition:border 0.3s}
.input-group input:focus{border-color:#667eea}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.3s;margin-top:10px}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(102,126,234,0.3)}
.btn-secondary{background:#1a1a2e;color:#888;border:1px solid #2a2a3e}
.btn-danger{background:#e74c3c;color:#fff}
.file-drop{border:2px dashed #2a2a3e;border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all 0.3s;margin:15px 0}
.file-drop:hover,.file-drop.dragover{border-color:#667eea;background:rgba(102,126,234,0.05)}
.file-drop p{color:#888;margin-top:10px}
.file-drop .icon{font-size:3rem}
.progress-section{display:none;margin-top:20px}
.file-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding:12px;background:#1a1a2e;border-radius:8px}
.file-name{font-weight:600;font-size:0.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.file-size{color:#888;font-size:0.85rem}
.progress-bar-container{width:100%;height:8px;background:#1a1a2e;border-radius:4px;overflow:hidden;margin:10px 0}
.progress-bar{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:4px;transition:width 0.1s linear;width:0%}
.stats{display:flex;justify-content:space-between;color:#888;font-size:0.85rem;margin-top:8px}
.status{text-align:center;padding:10px;color:#667eea;font-size:0.9rem}
.status.error{color:#e74c3c}
.status.success{color:#2ecc71}
.hidden{display:none!important}
.copy-btn{background:none;border:1px solid #2a2a3e;color:#888;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.85rem;margin-top:10px;transition:all 0.3s}
.copy-btn:hover{border-color:#667eea;color:#667eea}
.file-list{margin:10px 0;max-height:200px;overflow-y:auto}
.file-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#1a1a2e;border-radius:8px;margin-bottom:8px;font-size:0.85rem}
.file-item .remove{color:#e74c3c;cursor:pointer;font-weight:bold}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid #667eea;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
<div class="logo">
<h1>Sendly</h1>
<p>Fast direct P2P transfer between devices</p>
</div>

<div class="tabs">
<button class="tab send active" onclick="switchTab('send')">Send Files</button>
<button class="tab receive" onclick="switchTab('receive')">Receive Files</button>
</div>

<!-- SEND PANEL -->
<div class="panel active" id="sendPanel">
<div id="sendSetup">
<div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
<div class="icon">📁</div>
<p>Drop files here or click to select</p>
</div>
<input type="file" id="fileInput" multiple style="display:none">
<div class="file-list" id="fileList"></div>
<div class="status" id="sendStatus"></div>
<button class="btn btn-primary" id="startSendBtn" onclick="startSending()" style="display:none">Start Transfer</button>
</div>
<div class="progress-section" id="sendProgress">
<div class="file-info">
<span class="file-name" id="sendFileName">-</span>
<span class="file-size" id="sendFileSize">-</span>
</div>
<div class="progress-bar-container"><div class="progress-bar" id="sendBar"></div></div>
<div class="stats">
<span id="sendPercent">0%</span>
<span id="sendSpeed">0 MB/s</span>
<span id="sendETA">ETA: --</span>
</div>
<div class="status" id="sendFileCount"></div>
<button class="btn btn-danger" onclick="cancelTransfer()">Cancel</button>
</div>
</div>

<!-- RECEIVE PANEL -->
<div class="panel" id="receivePanel">
<div id="receiveSetup">
<div class="input-group">
<input type="text" id="codeInput" placeholder="Enter 6-digit code" maxlength="6" inputmode="numeric">
</div>
<button class="btn btn-primary" onclick="startReceiving()">Connect & Receive</button>
<div class="status" id="receiveStatus"></div>
</div>
<div class="progress-section" id="receiveProgress">
<div class="file-info">
<span class="file-name" id="recvFileName">-</span>
<span class="file-size" id="recvFileSize">-</span>
</div>
<div class="progress-bar-container"><div class="progress-bar" id="recvBar"></div></div>
<div class="stats">
<span id="recvPercent">0%</span>
<span id="recvSpeed">0 MB/s</span>
<span id="recvETA">ETA: --</span>
</div>
<div class="status" id="recvFileCount"></div>
<button class="btn btn-danger" onclick="cancelTransfer()">Cancel</button>
</div>
</div>
</div>

<script>
// ===== CONFIGURATION FOR MAX SPEED =====
const CHUNK_SIZE = 256 * 1024; // 256KB chunks - optimal balance
const BUFFER_HIGH = 4 * 1024 * 1024; // 4MB buffer threshold
const BUFFER_LOW = 1 * 1024 * 1024; // Resume at 1MB
const PROGRESS_INTERVAL = 200; // Update UI every 200ms

let peer = null;
let conn = null;
let files = [];
let currentFileIndex = 0;
let transferring = false;
let cancelled = false;
let lastProgressTime = 0;
let lastBytes = 0;

// ===== TAB SWITCHING =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab.${tab}`).classList.add('active');
  document.getElementById(`${tab}Panel`).classList.add('active');
}

// ===== FILE SELECTION =====
const fileDrop = document.getElementById('fileDrop');
const fileInput = document.getElementById('fileInput');

fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('dragover'); });
fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));
fileDrop.addEventListener('drop', e => {
  e.preventDefault();
  fileDrop.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => addFiles(fileInput.files));

function addFiles(fileListObj) {
  for (let f of fileListObj) files.push(f);
  renderFileList();
  document.getElementById('startSendBtn').style.display = files.length ? 'block' : 'none';
}

function renderFileList() {
  const el = document.getElementById('fileList');
  el.innerHTML = files.map((f, i) => `
    <div class="file-item">
      <span>${f.name} (${formatSize(f.size)})</span>
      <span class="remove" onclick="removeFile(${i})">✕</span>
    </div>`).join('');
}

function removeFile(i) {
  files.splice(i, 1);
  renderFileList();
  document.getElementById('startSendBtn').style.display = files.length ? 'block' : 'none';
}

// ===== SENDER =====
function startSending() {
  if (!files.length) return;
  setStatus('sendStatus', '<span class="spinner"></span>Creating room...');
  
  const code = generateCode();
  peer = new Peer('sendly-' + code, {
    debug: 0,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' }
      ]
    }
  });

  peer.on('open', () => {
    setStatus('sendStatus', `<div class="code-display">${code}</div><button class="copy-btn" onclick="copyCode('${code}')">📋 Copy Code</button><p style="color:#888;margin-top:10px;font-size:0.85rem">Share this code with the receiver</p>`);
  });

  peer.on('connection', c => {
    conn = c;
    setupConnection();
    conn.on('open', () => {
      document.getElementById('sendSetup').style.display = 'none';
      document.getElementById('sendProgress').style.display = 'block';
      transferring = true;
      cancelled = false;
      sendFiles();
    });
  });

  peer.on('error', err => {
    if (err.type === 'unavailable-id') {
      peer.destroy();
      startSending();
    } else {
      setStatus('sendStatus', 'Error: ' + err.type, true);
    }
  });
}

function sendFiles() {
  currentFileIndex = 0;
  sendNextFile();
}

function sendNextFile() {
  if (cancelled || currentFileIndex >= files.length) {
    if (!cancelled) {
      conn.send({ type: 'complete' });
      setStatus('sendStatus', 'Transfer Complete!', false, true);
      setTimeout(() => location.reload(), 3000);
    }
    return;
  }

  const file = files[currentFileIndex];
  document.getElementById('sendFileName').textContent = file.name;
  document.getElementById('sendFileSize').textContent = formatSize(file.size);
  document.getElementById('sendFileCount').textContent = `File ${currentFileIndex + 1} / ${files.length}`;

  // Send file metadata
  conn.send({
    type: 'file-meta',
    name: file.name,
    size: file.size,
    mime: file.type || 'application/octet-stream',
    index: currentFileIndex,
    total: files.length
  });

  // Read and send file in chunks
  const reader = new FileReader();
  reader.onload = () => {
    const buffer = reader.result;
    sendChunks(buffer, file.size);
  };
  reader.readAsArrayBuffer(file);
}

function sendChunks(buffer, totalSize) {
  let offset = 0;
  let lastSent = Date.now();
  let sentBytes = 0;

  function sendNext() {
    if (cancelled) return;

    // Backpressure: wait if buffer is too full
    if (conn.dataChannel && conn.dataChannel.bufferedAmount > BUFFER_HIGH) {
      setTimeout(sendNext, 10);
      return;
    }

    // Send multiple chunks per tick for speed
    let chunksThisTick = 0;
    while (offset < totalSize && chunksThisTick < 4) {
      if (cancelled) return;
      
      const end = Math.min(offset + CHUNK_SIZE, totalSize);
      const chunk = buffer.slice(offset, end);
      
      conn.send({ type: 'chunk', data: chunk });
      
      offset = end;
      sentBytes = offset;
      chunksThisTick++;

      // Check backpressure after each chunk
      if (conn.dataChannel && conn.dataChannel.bufferedAmount > BUFFER_HIGH) {
        setTimeout(sendNext, 5);
        return;
      }
    }

    // Update progress
    updateSendProgress(sentBytes, totalSize);

    if (offset < totalSize) {
      // Use setTimeout(0) to keep UI responsive
      if (conn.dataChannel && conn.dataChannel.bufferedAmount > BUFFER_LOW) {
        setTimeout(sendNext, 5);
      } else {
        setTimeout(sendNext, 0);
      }
    } else {
      // File complete
      conn.send({ type: 'file-end', index: currentFileIndex });
      currentFileIndex++;
      setTimeout(sendNextFile, 100);
    }
  }

  sendNext();
}

function updateSendProgress(sent, total) {
  const now = Date.now();
  if (now - lastProgressTime < PROGRESS_INTERVAL) return;
  
  const percent = ((sent / total) * 100).toFixed(1);
  const elapsed = (now - lastProgressTime) / 1000;
  const speed = elapsed > 0 ? (sent - lastBytes) / elapsed : 0;
  const remaining = speed > 0 ? (total - sent) / speed : 0;

  document.getElementById('sendBar').style.width = percent + '%';
  document.getElementById('sendPercent').textContent = percent + '%';
  document.getElementById('sendSpeed').textContent = formatSpeed(speed);
  document.getElementById('sendETA').textContent = 'ETA: ' + formatETA(remaining);

  lastProgressTime = now;
  lastBytes = sent;
}

// ===== RECEIVER =====
function startReceiving() {
  const code = document.getElementById('codeInput').value.trim();
  if (code.length !== 6) {
    setStatus('receiveStatus', 'Please enter a 6-digit code', true);
    return;
  }

  setStatus('receiveStatus', '<span class="spinner"></span>Connecting...');
  
  peer = new Peer(undefined, {
    debug: 0,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' }
      ]
    }
  });

  peer.on('open', () => {
    conn = peer.connect('sendly-' + code, { reliable: true });
    setupConnection();
    
    conn.on('open', () => {
      document.getElementById('receiveSetup').style.display = 'none';
      document.getElementById('receiveProgress').style.display = 'block';
      transferring = true;
      cancelled = false;
      setStatus('receiveStatus', 'Connected! Waiting for files...');
    });

    conn.on('error', err => {
      setStatus('receiveStatus', 'Connection error. Check the code.', true);
    });
  });

  peer.on('error', err => {
    if (err.type === 'peer-unavailable') {
      setStatus('receiveStatus', 'No sender found with that code', true);
    } else {
      setStatus('receiveStatus', 'Error: ' + err.type, true);
    }
  });

  // Timeout
  setTimeout(() => {
    if (!transferring) {
      setStatus('receiveStatus', 'Connection timed out', true);
    }
  }, 15000);
}

// ===== SHARED CONNECTION HANDLER =====
let receivedChunks = [];
let currentReceiveMeta = null;
let receivedBytes = 0;
let totalReceiveSize = 0;

function setupConnection() {
  conn.on('data', data => {
    if (cancelled) return;

    switch (data.type) {
      case 'file-meta':
        currentReceiveMeta = data;
        receivedChunks = [];
        receivedBytes = 0;
        document.getElementById('recvFileName').textContent = data.name;
        document.getElementById('recvFileSize').textContent = formatSize(data.size);
        document.getElementById('recvFileCount').textContent = `File ${data.index + 1} / ${data.total}`;
        lastProgressTime = Date.now();
        lastBytes = 0;
        break;

      case 'chunk':
        receivedChunks.push(data.data);
        receivedBytes += data.data.byteLength;
        updateReceiveProgress();
        break;

      case 'file-end':
        saveFile();
        break;

      case 'complete':
        setStatus('recvFileCount', 'All files received!', false, true);
        setTimeout(() => location.reload(), 3000);
        break;
    }
  });

  conn.on('close', () => {
    if (transferring && !cancelled) {
      alert('Connection lost');
      location.reload();
    }
  });
}

function updateReceiveProgress() {
  const now = Date.now();
  if (now - lastProgressTime < PROGRESS_INTERVAL) return;
  if (!currentReceiveMeta) return;

  const total = currentReceiveMeta.size;
  const percent = ((receivedBytes / total) * 100).toFixed(1);
  const elapsed = (now - lastProgressTime) / 1000;
  const speed = elapsed > 0 ? (receivedBytes - lastBytes) / elapsed : 0;
  const remaining = speed > 0 ? (total - receivedBytes) / speed : 0;

  document.getElementById('recvBar').style.width = percent + '%';
  document.getElementById('recvPercent').textContent = percent + '%';
  document.getElementById('recvSpeed').textContent = formatSpeed(speed);
  document.getElementById('recvETA').textContent = 'ETA: ' + formatETA(remaining);

  lastProgressTime = now;
  lastBytes = receivedBytes;
}

function saveFile() {
  if (!currentReceiveMeta) return;
  
  const blob = new Blob(receivedChunks, { type: currentReceiveMeta.mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = currentReceiveMeta.name;
  a.click();
  URL.revokeObjectURL(url);
  
  receivedChunks = [];
  currentReceiveMeta = null;
}

// ===== UTILITIES =====
function generateCode() {
  return Math.floor(100000 + Math.random() * 900000).toString();
}

function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.copy-btn');
    if (btn) btn.textContent = '✓ Copied!';
    setTimeout(() => { if (btn) btn.textContent = '📋 Copy Code'; }, 2000);
  });
}

function formatSize(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
}

function formatSpeed(bytesPerSec) {
  if (bytesPerSec === 0) return '0 MB/s';
  const mbps = bytesPerSec / (1024 * 1024);
  if (mbps >= 1) return mbps.toFixed(1) + ' MB/s';
  return (bytesPerSec / 1024).toFixed(0) + ' KB/s';
}

function formatETA(seconds) {
  if (!seconds || !isFinite(seconds)) return '--';
  if (seconds < 60) return Math.ceil(seconds) + 's';
  const m = Math.floor(seconds / 60);
  const s = Math.ceil(seconds % 60);
  return `${m}m ${s}s`;
}

function setStatus(id, html, isError = false, isSuccess = false) {
  const el = document.getElementById(id);
  el.innerHTML = html;
  el.className = 'status' + (isError ? ' error' : '') + (isSuccess ? ' success' : '');
}

function cancelTransfer() {
  cancelled = true;
  transferring = false;
  if (conn) conn.close();
  if (peer) peer.destroy();
  location.reload();
}

// Prevent page sleep during transfer
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && transferring) requestWakeLock();
});
</script>
</body>
</html>
