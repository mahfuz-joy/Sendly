<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sendly - Direct High-Speed File Transfer</title>

  <!-- PWA Theme Meta -->
  <meta name="theme-color" content="#5b68f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    (function() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#6366f1');
      grad.addColorStop(1, '#4338ca');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(140, 246);
      ctx.lineTo(372, 140);
      ctx.lineTo(266, 372);
      ctx.lineTo(224, 288);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.beginPath();
      ctx.moveTo(372, 140);
      ctx.lineTo(224, 288);
      ctx.lineTo(252, 252);
      ctx.closePath();
      ctx.fill();

      const iconUrl = canvas.toDataURL('image/png');

      const fav = document.createElement('link');
      fav.rel = 'icon';
      fav.type = 'image/png';
      fav.href = iconUrl;
      document.head.appendChild(fav);

      const apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = iconUrl;
      document.head.appendChild(apple);

      const manifestObj = {
        name: 'Sendly',
        short_name: 'Sendly',
        start_url: './',
        display: 'standalone',
        background_color: '#0b0e14',
        theme_color: '#5b68f6',
        icons: [
          {
            src: iconUrl,
            sizes: '512x512',
            type: 'image/png',
            purpose: 'any maskable'
          }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(manifestBlob);
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = manifestUrl;
      document.head.appendChild(manifestLink);
    })();
  </script>

  <!-- PeerJS for WebRTC signaling -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- QRCode.js for generating shareable QR codes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0e14;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: #141923;
      border: 1px solid #1e2638;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: #5b68f6;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto 18px;
      color: #ffffff;
      box-shadow: 0 12px 28px rgba(91, 104, 246, 0.4);
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .tagline {
      color: #7b8a9e;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .primary-btn {
      width: 100%;
      background: #5b68f6;
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn:hover:not(:disabled) {
      background: #4a57ea;
      transform: translateY(-1px);
    }

    .primary-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .secondary-btn {
      width: 100%;
      background: #1b2232;
      color: #ffffff;
      border: 1px solid #28344c;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 24px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .secondary-btn:hover {
      background: #232d42;
      border-color: #38496b;
    }

    .footer-note {
      font-size: 12px;
      color: #617085;
    }

    .view-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: #8b9bb4;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      border-radius: 8px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: #ffffff;
    }

    .header-title {
      font-size: 11px;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: #72849e;
      text-transform: uppercase;
    }

    .code-display-box {
      background: #0d1118;
      border: 1px solid #1a2230;
      border-radius: 16px;
      padding: 22px 10px;
      margin-bottom: 18px;
    }

    #display-code {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .qr-wrapper {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #qrcode {
      min-height: 160px;
      min-width: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img {
      margin: 0 auto;
      border-radius: 4px;
    }

    .action-btn-outline {
      width: 100%;
      background: #1b2232;
      color: #ffffff;
      border: 1px solid #28344c;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn-outline:hover {
      background: #232d42;
    }

    .cancel-btn {
      width: 100%;
      background: transparent;
      color: #ef4444;
      border: 1px solid #4a1515;
      padding: 13px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }

    .cancel-btn:hover {
      background: rgba(239, 68, 68, 0.12);
      border-color: #ef4444;
    }

    .input-instruction {
      text-align: left;
      font-size: 11px;
      letter-spacing: 1.2px;
      font-weight: 700;
      color: #72849e;
      margin-bottom: 14px;
    }

    .otp-container {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 22px;
    }

    .otp-input {
      width: 48px;
      height: 56px;
      background: #0d1118;
      border: 1px solid #232c3d;
      border-radius: 12px;
      color: #ffffff;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .otp-input:focus {
      border-color: #5b68f6;
      box-shadow: 0 0 0 2px rgba(91, 104, 246, 0.25);
    }

    .separator-line {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 18px 0;
      color: #4b5563;
      font-size: 12px;
    }

    .separator-line::before,
    .separator-line::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #1f283a;
    }

    .separator-line span {
      padding: 0 10px;
    }

    .file-meta-card {
      background: #0d1118;
      border: 1px solid #1e2638;
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      text-align: left;
    }

    .file-icon-box {
      width: 46px;
      height: 46px;
      background: #1b2232;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5b68f6;
      flex-shrink: 0;
    }

    .file-info-col {
      overflow: hidden;
      flex: 1;
    }

    .file-name-text {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .file-size-text {
      font-size: 12px;
      color: #7b8a9e;
    }

    .transfer-hud {
      background: #0d1118;
      border: 1px solid #1e2638;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
      text-align: left;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #1b2232;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    #progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #5b68f6, #10b981);
      transition: width 0.1s linear;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .speed-info {
      font-size: 12px;
      color: #10b981;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
    }

    .success-badge {
      width: 68px;
      height: 68px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 16px auto 16px;
      color: #10b981;
    }

    .toast-msg {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      z-index: 100;
      pointer-events: none;
      transition: opacity 0.3s ease;
      opacity: 0;
    }

    .toast-msg.show {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="toast" class="toast-msg"></div>

    <!-- VIEW 1: HOME SCREEN -->
    <div id="view-home">
      <div class="brand-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
      </div>
      <h1 class="brand-name">Sendly</h1>
      <p class="tagline">Send files directly between devices.</p>

      <input type="file" id="hidden-file-input" style="display: none;" onchange="onFilePicked(event)">
      <button class="primary-btn" onclick="document.getElementById('hidden-file-input').click()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Send
      </button>
      <button class="secondary-btn" onclick="openReceiveView()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Receive
      </button>

      <p class="footer-note">Files transfer directly between your devices.</p>
    </div>

    <!-- VIEW 2: SENDER CODE & QR SCREEN -->
    <div id="view-send" class="hidden">
      <div class="view-header">
        <button class="back-btn" onclick="cancelAndReset()">&#8249;</button>
        <span class="header-title">SEND &mdash; SHARE CODE</span>
      </div>

      <div class="code-display-box">
        <span id="display-code">------</span>
      </div>

      <div class="qr-wrapper">
        <div id="qrcode"></div>
      </div>

      <button class="action-btn-outline" onclick="copyShareLink()">Copy Link</button>
      <button class="cancel-btn" onclick="cancelAndReset()">Cancel Transfer</button>
    </div>

    <!-- VIEW 3: RECEIVER CODE INPUT SCREEN -->
    <div id="view-receive" class="hidden">
      <div class="view-header">
        <button class="back-btn" onclick="cancelAndReset()">&#8249;</button>
        <span class="header-title">RECEIVE &mdash; ENTER CODE</span>
      </div>

      <p class="input-instruction">ENTER CODE</p>
      <div class="otp-container">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
      </div>

      <button id="btn-connect" class="primary-btn" onclick="connectWithCode()" disabled>Connect</button>

      <div class="separator-line"><span>or</span></div>

      <button class="action-btn-outline" onclick="showToast('Enter the 6-digit code or scan with phone camera.')">Scan QR Code</button>
      <button class="cancel-btn" onclick="cancelAndReset()">Cancel</button>
    </div>

    <!-- VIEW 4: ACTIVE TRANSFER HUD SCREEN -->
    <div id="view-transfer" class="hidden">
      <div class="view-header">
        <span id="transfer-screen-title" class="header-title">TRANSFERRING FILE</span>
      </div>

      <div id="transfer-icon-area">
        <div class="file-meta-card">
          <div class="file-icon-box">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
              <polyline points="13 2 13 9 20 9"></polyline>
            </svg>
          </div>
          <div class="file-info-col">
            <div id="meta-filename" class="file-name-text">filename.ext</div>
            <div id="meta-filesize" class="file-size-text">0 MB</div>
          </div>
        </div>
      </div>

      <!-- Completion Badge -->
      <div id="completion-box" class="hidden">
        <div class="success-badge">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">Transfer Complete!</h2>
        <p style="font-size: 13px; color: #8b9bb4; margin-bottom: 24px;">File delivered safely between devices.</p>
      </div>

      <!-- Progress Section -->
      <div class="transfer-hud">
        <div class="progress-bar-bg">
          <div id="progress-bar-fill"></div>
        </div>
        <div class="progress-info">
          <span id="transfer-status">Connecting...</span>
          <span id="transfer-percentage">0%</span>
        </div>
        <div class="speed-info">
          <span id="transfer-speed">0.0 MB/s</span>
          <span id="transfer-eta">ETA: calculating...</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div id="transfer-actions">
        <button id="btn-cancel-transfer" class="cancel-btn" style="margin-top: 4px;" onclick="cancelAndReset()">Cancel Transfer</button>
      </div>

      <div id="completion-actions" class="hidden">
        <button class="primary-btn" onclick="sendAnotherFile()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Send Another File
        </button>
        <button class="secondary-btn" style="margin-bottom: 0;" onclick="cancelAndReset()">Done</button>
      </div>
    </div>

  </div>

  <script>
    // Metered TURN Credentials + Global Google STUN Servers
    const PEER_CONFIG = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun.relay.metered.ca:80' },
          {
            urls: 'turn:global.relay.metered.ca:80',
            username: '62588f777bbaaf306ef3f17f',
            credential: 'vCNtTXqhnEYquavX'
          },
          {
            urls: 'turn:global.relay.metered.ca:80?transport=tcp',
            username: '62588f777bbaaf306ef3f17f',
            credential: 'vCNtTXqhnEYquavX'
          },
          {
            urls: 'turn:global.relay.metered.ca:443',
            username: '62588f777bbaaf306ef3f17f',
            credential: 'vCNtTXqhnEYquavX'
          },
          {
            urls: 'turns:global.relay.metered.ca:443?transport=tcp',
            username: '62588f777bbaaf306ef3f17f',
            credential: 'vCNtTXqhnEYquavX'
          }
        ],
        sdpSemantics: 'unified-plan'
      }
    };

    let peer = null;
    let activeConnection = null;
    let rawDataChannel = null;
    let selectedFile = null;
    let isCancelled = false;
    let isSender = false;
    let handshakeTimer = null;

    // Restored Sweet-Spot: Maximum throughput, lowest latency & zero congestion
    const CHUNK_SIZE = 64 * 1024; // 64 KB (optimal SCTP frame size, prevents socket buffering)
    const BUFFER_CEILING = 1.5 * 1024 * 1024; // 1.5 MB high watermark
    const BUFFER_FLOOR = 256 * 1024; // 256 KB low watermark (instant seamless resumption)

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function generateSixDigitCode() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function showView(viewId) {
      ['view-home', 'view-send', 'view-receive', 'view-transfer'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
    }

    function cancelAndReset() {
      isCancelled = true;
      if (handshakeTimer) {
        clearInterval(handshakeTimer);
        handshakeTimer = null;
      }
      if (rawDataChannel && rawDataChannel.readyState === 'open') {
        try {
          rawDataChannel.send(JSON.stringify({ type: 'control-cancel' }));
          rawDataChannel.close();
        } catch (e) {}
      }
      if (activeConnection) {
        try { activeConnection.close(); } catch (e) {}
        activeConnection = null;
      }
      if (peer) {
        try { peer.destroy(); } catch (e) {}
        peer = null;
      }
      rawDataChannel = null;
      selectedFile = null;
      document.getElementById('hidden-file-input').value = '';
      showView('view-home');
    }

    function sendAnotherFile() {
      cancelAndReset();
      setTimeout(() => {
        document.getElementById('hidden-file-input').click();
      }, 150);
    }

    function openReceiveView() {
      isSender = false;
      showView('view-receive');
      setupOtpInputs();
      if (!peer) initReceiverPeer();
    }

    function onFilePicked(event) {
      const file = event.target.files[0];
      if (!file) return;
      selectedFile = file;
      isCancelled = false;
      isSender = true;

      const code = generateSixDigitCode();
      const peerId = 'sendly-' + code;

      if (peer) peer.destroy();
      peer = new Peer(peerId, PEER_CONFIG);

      peer.on('error', (err) => {
        showToast('Connection error: ' + err.type);
      });

      peer.on('open', () => {
        document.getElementById('display-code').innerText = code;
        showView('view-send');

        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        const shareUrl = `${window.location.origin}${window.location.pathname}?code=${code}`;
        new QRCode(qrContainer, {
          text: shareUrl,
          width: 160,
          height: 160,
          colorDark: '#000000',
          colorLight: '#ffffff'
        });
      });

      peer.on('connection', (conn) => {
        activeConnection = conn;

        const onOpen = () => {
          rawDataChannel = activeConnection.dataChannel;
          rawDataChannel.binaryType = 'arraybuffer';
          setupRawSenderChannel(selectedFile);
        };

        if (activeConnection.open) {
          onOpen();
        } else {
          activeConnection.on('open', onOpen);
        }

        activeConnection.on('error', () => {
          showToast('Data channel error.');
        });
      });
    }

    function copyShareLink() {
      const code = document.getElementById('display-code').innerText;
      const shareUrl = `${window.location.origin}${window.location.pathname}?code=${code}`;
      const tempInput = document.createElement('input');
      tempInput.value = shareUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast('Share link copied!');
      } catch (e) {
        showToast('Link copied to clipboard!');
      }
      document.body.removeChild(tempInput);
    }

    function initReceiverPeer() {
      peer = new Peer(PEER_CONFIG);
      peer.on('error', (err) => {
        showToast('Network error: ' + err.type);
      });
    }

    function setupOtpInputs() {
      const inputs = document.querySelectorAll('.otp-input');
      inputs.forEach((input, idx) => {
        input.value = '';
        input.oninput = (e) => {
          if (e.target.value.length === 1 && idx < inputs.length - 1) {
            inputs[idx + 1].focus();
          }
          checkOtpFilled();
        };
        input.onkeydown = (e) => {
          if (e.key === 'Backspace' && !e.target.value && idx > 0) {
            inputs[idx - 1].focus();
          }
        };
      });
      inputs[0].focus();
    }

    function checkOtpFilled() {
      const inputs = document.querySelectorAll('.otp-input');
      let fullCode = '';
      inputs.forEach(i => fullCode += i.value);
      document.getElementById('btn-connect').disabled = fullCode.length !== 6;
    }

    function connectWithCode(customCode = null) {
      let targetCode = customCode;
      if (!targetCode) {
        const inputs = document.querySelectorAll('.otp-input');
        targetCode = '';
        inputs.forEach(i => targetCode += i.value);
      }

      if (targetCode.length !== 6) return;
      isCancelled = false;

      const targetPeerId = 'sendly-' + targetCode;
      initTransferView('RECEIVING FILE', 'Connecting to sender...', 0);

      if (!peer) peer = new Peer(PEER_CONFIG);

      if (peer.open) {
        makeReceiverCall(targetPeerId);
      } else {
        peer.on('open', () => {
          makeReceiverCall(targetPeerId);
        });
      }
    }

    function makeReceiverCall(targetPeerId) {
      activeConnection = peer.connect(targetPeerId, { reliable: true });

      const onOpen = () => {
        rawDataChannel = activeConnection.dataChannel;
        rawDataChannel.binaryType = 'arraybuffer';
        setupRawReceiverChannel();
      };

      if (activeConnection.open) {
        onOpen();
      } else {
        activeConnection.on('open', onOpen);
      }

      activeConnection.on('error', () => {
        updateProgressHUD(0, 'Failed to connect.');
        showToast('Connection failed.');
      });
    }

    function initTransferView(title, statusText, percent, fileName = 'Connecting...', fileSize = 0) {
      showView('view-transfer');
      document.getElementById('transfer-screen-title').innerText = title;
      document.getElementById('meta-filename').innerText = fileName;
      document.getElementById('meta-filesize').innerText = formatBytes(fileSize);

      document.getElementById('transfer-icon-area').classList.remove('hidden');
      document.getElementById('completion-box').classList.add('hidden');
      document.getElementById('transfer-actions').classList.remove('hidden');
      document.getElementById('completion-actions').classList.add('hidden');

      updateProgressHUD(percent, statusText);
      document.getElementById('transfer-speed').innerText = '0.0 MB/s';
      document.getElementById('transfer-eta').innerText = 'ETA: calculating...';
    }

    function showTransferComplete() {
      document.getElementById('transfer-icon-area').classList.add('hidden');
      document.getElementById('completion-box').classList.remove('hidden');
      document.getElementById('transfer-actions').classList.add('hidden');
      document.getElementById('completion-actions').classList.remove('hidden');

      updateProgressHUD(100, 'Delivered');
      document.getElementById('transfer-speed').innerText = 'Complete';
      document.getElementById('transfer-eta').innerText = '';
    }

    function updateProgressHUD(percent, label) {
      document.getElementById('progress-bar-fill').style.width = percent + '%';
      document.getElementById('transfer-percentage').innerText = percent + '%';
      document.getElementById('transfer-status').innerText = label;
    }

    function renderSpeedHUD(speedBps, transferredBytes, totalBytes) {
      let speedText = '0.0 MB/s';
      if (speedBps >= 1024 * 1024) {
        speedText = (speedBps / (1024 * 1024)).toFixed(1) + ' MB/s';
      } else if (speedBps > 0) {
        speedText = (speedBps / 1024).toFixed(0) + ' KB/s';
      }

      const remainingBytes = Math.max(0, totalBytes - transferredBytes);
      const remainingSecs = speedBps > 0 ? Math.round(remainingBytes / speedBps) : 0;
      const etaText = remainingSecs > 0 ? `ETA: ${remainingSecs}s` : (transferredBytes >= totalBytes ? 'Done' : 'ETA: finalizing...');

      document.getElementById('transfer-speed').innerText = speedText;
      document.getElementById('transfer-eta').innerText = etaText;
    }

    function setupRawReceiverChannel() {
      let receivedChunks = [];
      let meta = null;
      let receivedBytes = 0;

      let lastUiUpdate = 0;
      let lastSpeedCalc = performance.now();
      let bytesAtLastSpeedCalc = 0;
      let smoothedSpeedBps = 0;

      rawDataChannel.onmessage = (event) => {
        if (isCancelled) return;
        const data = event.data;

        if (typeof data === 'string') {
          try {
            const msg = JSON.parse(data);
            if (msg.type === 'file-meta') {
              meta = msg;
              receivedChunks = [];
              receivedBytes = 0;
              lastUiUpdate = 0;
              lastSpeedCalc = performance.now();
              bytesAtLastSpeedCalc = 0;
              smoothedSpeedBps = 0;

              initTransferView('RECEIVING FILE', 'Receiving file...', 0, meta.name, meta.size);

              // Immediate handshake confirmation
              rawDataChannel.send(JSON.stringify({ type: 'file-meta-ack' }));
            } else if (msg.type === 'control-cancel') {
              showToast('Sender cancelled the transfer.');
              cancelAndReset();
            }
          } catch (e) {}
          return;
        }

        // Receiving binary stream
        if (data instanceof ArrayBuffer && meta) {
          receivedChunks.push(data);
          receivedBytes += data.byteLength;

          const now = performance.now();

          // Calculate speed every 250ms smoothly
          if (now - lastSpeedCalc >= 250) {
            const dt = (now - lastSpeedCalc) / 1000;
            const db = receivedBytes - bytesAtLastSpeedCalc;
            const instantSpeed = db / dt;
            smoothedSpeedBps = smoothedSpeedBps === 0 ? instantSpeed : (smoothedSpeedBps * 0.75 + instantSpeed * 0.25);
            bytesAtLastSpeedCalc = receivedBytes;
            lastSpeedCalc = now;
          }

          // STRICT THROTTLE: Update DOM at most once every 100ms to keep CPU light
          if (now - lastUiUpdate >= 100 || receivedBytes >= meta.size) {
            lastUiUpdate = now;
            const progress = Math.min(99, Math.round((receivedBytes / meta.size) * 100));
            updateProgressHUD(progress, 'Receiving...');
            renderSpeedHUD(smoothedSpeedBps, receivedBytes, meta.size);
          }

          // Completion check
          if (receivedBytes >= meta.size) {
            updateProgressHUD(100, 'Saving to device...');

            try {
              rawDataChannel.send(JSON.stringify({ type: 'file-done' }));
            } catch (e) {}

            const blob = new Blob(receivedChunks, { type: meta.fileType || 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = meta.name;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
            }, 10000);

            showTransferComplete();
          }
        }
      };
    }

    function setupRawSenderChannel(file) {
      initTransferView('SENDING FILE', 'Connecting to receiver...', 0, file.name, file.size);
      let isTransferring = false;

      const sendMeta = () => {
        if (isCancelled || isTransferring) return;
        try {
          if (rawDataChannel && rawDataChannel.readyState === 'open') {
            rawDataChannel.send(JSON.stringify({
              type: 'file-meta',
              name: file.name,
              size: file.size,
              fileType: file.type || 'application/octet-stream'
            }));
          }
        } catch (e) {}
      };

      sendMeta();
      if (handshakeTimer) clearInterval(handshakeTimer);
      handshakeTimer = setInterval(sendMeta, 250);

      rawDataChannel.onmessage = (event) => {
        if (typeof event.data === 'string') {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'file-meta-ack') {
              if (handshakeTimer) {
                clearInterval(handshakeTimer);
                handshakeTimer = null;
              }
              if (!isTransferring) {
                isTransferring = true;
                pumpStreamSmooth(file);
              }
            } else if (msg.type === 'file-done') {
              showTransferComplete();
            } else if (msg.type === 'control-cancel') {
              showToast('Receiver cancelled the transfer.');
              cancelAndReset();
            }
          } catch (e) {}
        }
      };
    }

    async function pumpStreamSmooth(file) {
      let fileOffset = 0;
      let lastUiUpdate = 0;
      let lastSpeedCalc = performance.now();
      let bytesAtLastSpeedCalc = 0;
      let smoothedSpeedBps = 0;

      updateProgressHUD(0, 'Sending file...');

      if (rawDataChannel) {
        rawDataChannel.bufferedAmountLowThreshold = BUFFER_FLOOR;
      }

      while (fileOffset < file.size) {
        if (isCancelled || !rawDataChannel || rawDataChannel.readyState !== 'open') return;

        // Flow control without busy-waiting: Clean promise with 35ms watchdog
        if (rawDataChannel.bufferedAmount > BUFFER_CEILING) {
          await new Promise((resolve) => {
            let timer = null;
            const onLow = () => {
              if (timer) clearTimeout(timer);
              if (rawDataChannel) rawDataChannel.onbufferedamountlow = null;
              resolve();
            };

            if (rawDataChannel) {
              rawDataChannel.onbufferedamountlow = onLow;
            }
            // 35ms fast watchdog ensures pipeline never sits idle
            timer = setTimeout(onLow, 35);
          });
        }

        if (isCancelled || !rawDataChannel || rawDataChannel.readyState !== 'open') return;

        const sliceEnd = Math.min(fileOffset + CHUNK_SIZE, file.size);
        const slice = file.slice(fileOffset, sliceEnd);
        const chunk = await slice.arrayBuffer();

        rawDataChannel.send(chunk);
        fileOffset += chunk.byteLength;

        const now = performance.now();

        // Calculate smooth speed every 250ms
        if (now - lastSpeedCalc >= 250) {
          const dt = (now - lastSpeedCalc) / 1000;
          const db = fileOffset - bytesAtLastSpeedCalc;
          const instantSpeed = db / dt;
          smoothedSpeedBps = smoothedSpeedBps === 0 ? instantSpeed : (smoothedSpeedBps * 0.75 + instantSpeed * 0.25);
          bytesAtLastSpeedCalc = fileOffset;
          lastSpeedCalc = now;
        }

        // STRICT THROTTLE: Update sender UI at most once every 100ms
        if (now - lastUiUpdate >= 100 || fileOffset >= file.size) {
          lastUiUpdate = now;
          const progress = Math.min(99, Math.round((fileOffset / file.size) * 100));
          updateProgressHUD(progress, 'Sending file...');
          renderSpeedHUD(smoothedSpeedBps, fileOffset, file.size);
        }
      }

      updateProgressHUD(99, 'Finalizing transfer...');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const autoCode = urlParams.get('code');
      if (autoCode && autoCode.length === 6) {
        openReceiveView();
        const inputs = document.querySelectorAll('.otp-input');
        autoCode.split('').forEach((digit, idx) => {
          if (inputs[idx]) inputs[idx].value = digit;
        });
        connectWithCode(autoCode);
      }
    });
  </script>
</body>
