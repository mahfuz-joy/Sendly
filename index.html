<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sendly — Ultra-Fast Direct P2P File Transfer</title>

  <!-- PWA Theme Meta -->
  <meta name="theme-color" content="#5b68f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Dynamic Icon & Manifest -->
  <script>
    (function() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#6366f1');
      grad.addColorStop(1, '#4338ca');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(140, 246);
      ctx.lineTo(372, 140);
      ctx.lineTo(266, 372);
      ctx.lineTo(224, 288);
      ctx.closePath();
      ctx.fill();

      const iconUrl = canvas.toDataURL('image/png');
      const fav = document.createElement('link');
      fav.rel = 'icon';
      fav.type = 'image/png';
      fav.href = iconUrl;
      document.head.appendChild(fav);
    })();
  </script>

  <!-- High-Speed WebRTC Signaling and QR Library -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b0e14;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .card {
      background: #141923;
      border: 1px solid #1e2638;
      border-radius: 24px;
      width: 100%;
      max-width: 410px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      position: relative;
      overflow: hidden;
      contain: content;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #4338ca);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px auto 18px;
      color: #ffffff;
      box-shadow: 0 12px 28px rgba(91, 104, 246, 0.4);
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .tagline {
      color: #7b8a9e;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .primary-btn {
      width: 100%;
      background: #5b68f6;
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .primary-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .secondary-btn {
      width: 100%;
      background: #1b2232;
      color: #ffffff;
      border: 1px solid #28344c;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .secondary-btn:hover {
      background: #232d42;
    }

    .footer-note {
      font-size: 12px;
      color: #617085;
    }

    .view-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: #8b9bb4;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .header-title {
      font-size: 12px;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: #72849e;
      text-transform: uppercase;
    }

    .code-display-box {
      background: #0d1118;
      border: 1px solid #1a2230;
      border-radius: 16px;
      padding: 18px 10px;
      margin-bottom: 16px;
    }

    #display-code {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .qr-wrapper {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    #qrcode {
      min-height: 160px;
      min-width: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img {
      margin: 0 auto;
      border-radius: 4px;
    }

    .action-btn-outline {
      width: 100%;
      background: #1b2232;
      color: #ffffff;
      border: 1px solid #28344c;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .cancel-btn {
      width: 100%;
      background: transparent;
      color: #ef4444;
      border: 1px solid #4a1515;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .input-instruction {
      text-align: left;
      font-size: 11px;
      letter-spacing: 1.2px;
      font-weight: 700;
      color: #72849e;
      margin-bottom: 14px;
    }

    .otp-container {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 22px;
    }

    .otp-input {
      width: 48px;
      height: 54px;
      background: #0d1118;
      border: 1px solid #232c3d;
      border-radius: 12px;
      color: #ffffff;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      outline: none;
    }

    .otp-input:focus {
      border-color: #5b68f6;
      box-shadow: 0 0 0 2px rgba(91, 104, 246, 0.25);
    }

    .file-meta-card {
      background: #0d1118;
      border: 1px solid #1e2638;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      text-align: left;
    }

    .file-icon-box {
      width: 46px;
      height: 46px;
      background: #1b2232;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5b68f6;
      flex-shrink: 0;
    }

    .file-info-col {
      overflow: hidden;
      flex: 1;
    }

    .file-name-text {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .file-size-text {
      font-size: 12px;
      color: #7b8a9e;
    }

    .transfer-hud {
      background: #0d1118;
      border: 1px solid #1e2638;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
      text-align: left;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #1b2232;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    /* Zero CPU-stall GPU accelerated bar */
    #progress-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #5b68f6, #10b981);
      border-radius: 6px;
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
      contain: strict;
      transition: transform 0.12s linear;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .speed-info {
      font-size: 12px;
      color: #10b981;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
    }

    .success-badge {
      width: 68px;
      height: 68px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 16px auto 16px;
      color: #10b981;
    }

    .toast-msg {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      z-index: 100;
      pointer-events: none;
      transition: opacity 0.25s ease;
      opacity: 0;
      white-space: nowrap;
    }

    .toast-msg.show {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

      <input type="file" id="hidden-file-input" style="display: none;" onchange="onFilePicked(event)">

      <!-- Completion -->

      </div>

  <script>
    /*
      OPTIMIZATIONS IMPLEMENTED:
      1. Optimal SCTP DataChannel chunk sizing (64KB). Avoids browser memory fragmentation and packet stalls.
      2. Off-Heap Chunk Batching on Receiver (8MB sub-blobs). Eliminates JavaScript Heap garbage collection freeze.
      3. Non-blocking Asynchronous Slicing: Yields to the main thread every 2MB so the UI stays at 60 FPS.
      4. Auto Screen WakeLock: Keeps phone screens awake so mobile OS doesn't kill the transfer in the background.
      5. Paced Backpressure: 2MB High Water, 512KB Low Water. Maximizes throughput on Wi-Fi without bufferbloat.
    */

    const PEER_CONFIG = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' }
        ],
        sdpSemantics: 'unified-plan'
      }
    };

    // Buffer thresholds
    const CHUNK_SIZE = 64 * 1024; // 64 KB (Universally optimal for WebRTC SCTP stack)
    const SEND_HIGH_WATER = 2 * 1024 * 1024; // 2 MB
    const SEND_LOW_WATER = 512 * 1024;       // 512 KB
    const RECEIVER_BATCH_SIZE = 8 * 1024 * 1024; // 8 MB sub-blob partition size

    let peer = null;
    let activeConnection = null;
    let rawDataChannel = null;
    let selectedFile = null;
    let isCancelled = false;
    let isSender = false;
    let wakeLock = null;

    let currentBytesTransferred = 0;
    let totalBytesToTransfer = 0;

    // Smoothed UI metrics
    let uiTimer = null;
    let uiLastBytes = 0;
    let uiLastTime = 0;
    let speedEmaBps = 0;
    let targetStatusText = 'Connecting...';
    let targetEtaText = 'ETA: calculating...';

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (_) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        try { wakeLock.release(); } catch (_) {}
        wakeLock = null;
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function generateSixDigitCode() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(k)), sizes.length - 1);
      return (bytes / Math.pow(k, i)).toFixed(i === 0 ? 0 : 1) + ' ' + sizes[i];
    }

    function showView(viewId) {
      ['view-home', 'view-send', 'view-receive', 'view-transfer'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
    }

    function setProgressPercent(percent) {
      const p = Math.max(0, Math.min(100, percent));
      const fill = document.getElementById('progress-bar-fill');
      const pct = document.getElementById('transfer-percentage');
      if (fill) fill.style.transform = `scaleX(${p / 100})`;
      if (pct) pct.innerText = Math.floor(p) + '%';
    }

    function renderTransferUI(force = false) {
      const now = performance.now();
      if (!force && uiLastTime && now - uiLastTime < 200) return;

      const dt = uiLastTime ? (now - uiLastTime) / 1000 : 0;
      const db = currentBytesTransferred - uiLastBytes;

      if (dt > 0) {
        const instant = Math.max(0, db / dt);
        speedEmaBps = speedEmaBps === 0 ? instant : (speedEmaBps * 0.7 + instant * 0.3);
      }

      uiLastTime = now;
      uiLastBytes = currentBytesTransferred;

      const realPercent = totalBytesToTransfer > 0
        ? (currentBytesTransferred / totalBytesToTransfer) * 100
        : 0;

      setProgressPercent(targetStatusText === 'Delivered' ? 100 : Math.min(99.9, realPercent));

      const status = document.getElementById('transfer-status');
      const speed = document.getElementById('transfer-speed');
      const eta = document.getElementById('transfer-eta');

      if (status) status.innerText = targetStatusText;

      if (speed) {
        if (targetStatusText === 'Delivered') {
          speed.innerText = 'Completed';
        } else if (speedEmaBps >= 1024 * 1024) {
          speed.innerText = (speedEmaBps / (1024 * 1024)).toFixed(1) + ' MB/s';
        } else if (speedEmaBps >= 1024) {
          speed.innerText = (speedEmaBps / 1024).toFixed(0) + ' KB/s';
        } else {
          speed.innerText = '0 KB/s';
        }
      }

      if (eta) {
        if (targetStatusText === 'Delivered') {
          eta.innerText = '';
        } else if (speedEmaBps > 0 && totalBytesToTransfer > 0) {
          const remaining = Math.max(0, totalBytesToTransfer - currentBytesTransferred);
          const secs = Math.ceil(remaining / speedEmaBps);
          eta.innerText = secs > 0 ? `ETA: ${secs}s` : 'ETA: <1s';
        } else {
          eta.innerText = targetEtaText;
        }
      }
    }

    function startUiLoop() {
      stopUiLoop();
      uiLastBytes = currentBytesTransferred;
      uiLastTime = performance.now();
      speedEmaBps = 0;
      uiTimer = setInterval(() => {
        if (!isCancelled) renderTransferUI(false);
      }, 200);
      renderTransferUI(true);
    }

    function stopUiLoop() {
      if (uiTimer) {
        clearInterval(uiTimer);
        uiTimer = null;
      }
    }

    function cleanupChannel() {
      const dc = rawDataChannel;
      rawDataChannel = null;
      if (dc) {
        try {
          dc.onmessage = null;
          dc.onopen = null;
          dc.onclose = null;
          dc.onerror = null;
          dc.onbufferedamountlow = null;
          if (dc.readyState !== 'closed') dc.close();
        } catch (_) {}
      }
    }

    function cancelAndReset() {
      isCancelled = true;
      releaseWakeLock();
      stopUiLoop();

      if (rawDataChannel && rawDataChannel.readyState === 'open') {
        try { rawDataChannel.send(JSON.stringify({ type: 'control-cancel' })); } catch (_) {}
      }

      cleanupChannel();

      if (activeConnection) {
        try { activeConnection.close(); } catch (_) {}
        activeConnection = null;
      }

      if (peer) {
        try { peer.destroy(); } catch (_) {}
        peer = null;
      }

      selectedFile = null;
      currentBytesTransferred = 0;
      totalBytesToTransfer = 0;

      const input = document.getElementById('hidden-file-input');
      if (input) input.value = '';

      showView('view-home');
    }

    function sendAnotherFile() {
      cancelAndReset();
      setTimeout(() => document.getElementById('hidden-file-input').click(), 100);
    }

    function openReceiveView() {
      isSender = false;
      showView('view-receive');
      setupOtpInputs();
      if (!peer) initReceiverPeer();
    }

    function copyShareLink() {
      const code = document.getElementById('display-code').innerText;
      const shareUrl = `${window.location.origin}${window.location.pathname}?code=${code}`;

      const el = document.createElement('textarea');
      el.value = shareUrl;
      el.style.position = 'fixed';
      el.style.opacity = '0';
      document.body.appendChild(el);
      el.select();
      try {
        document.execCommand('copy');
        showToast('Link copied to clipboard!');
      } catch (_) {
        showToast('Copy link manually: ' + shareUrl);
      }
      document.body.removeChild(el);
    }

    function setupOtpInputs() {
      const inputs = document.querySelectorAll('.otp-input');
      inputs.forEach((input, idx) => {
        input.value = '';
        input.oninput = (e) => {
          e.target.value = e.target.value.replace(/\D/g, '').slice(0, 1);
          if (e.target.value && idx < inputs.length - 1) inputs[idx + 1].focus();
          checkOtpFilled();
        };
        input.onkeydown = (e) => {
          if (e.key === 'Backspace' && !e.target.value && idx > 0) {
            inputs[idx - 1].focus();
          }
        };
        input.onpaste = (e) => {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
          pasted.split('').forEach((digit, i) => {
            if (inputs[i]) inputs[i].value = digit;
          });
          checkOtpFilled();
          if (pasted.length === 6) inputs[5].focus();
        };
      });
      setTimeout(() => inputs[0].focus(), 150);
    }

    function checkOtpFilled() {
      const inputs = document.querySelectorAll('.otp-input');
      let fullCode = '';
      inputs.forEach(i => fullCode += i.value);
      document.getElementById('btn-connect').disabled = fullCode.length !== 6;
    }

    function initTransferView(title, statusText, percent, fileName = 'Connecting...', fileSize = 0) {
      showView('view-transfer');
      document.getElementById('transfer-screen-title').innerText = title;
      document.getElementById('meta-filename').innerText = fileName;
      document.getElementById('meta-filesize').innerText = formatBytes(fileSize);

      document.getElementById('transfer-icon-area').classList.remove('hidden');
      document.getElementById('completion-box').classList.add('hidden');
      document.getElementById('transfer-actions').classList.remove('hidden');
      document.getElementById('completion-actions').classList.add('hidden');

      currentBytesTransferred = Math.max(0, percent * fileSize / 100);
      totalBytesToTransfer = fileSize;
      targetStatusText = statusText;
      targetEtaText = 'ETA: calculating...';

      setProgressPercent(percent);
      startUiLoop();
      requestWakeLock();
    }

    function showTransferComplete() {
      targetStatusText = 'Delivered';
      targetEtaText = '';
      currentBytesTransferred = totalBytesToTransfer;
      setProgressPercent(100);
      renderTransferUI(true);
      stopUiLoop();
      releaseWakeLock();

      try {
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
      } catch (_) {}

      document.getElementById('transfer-icon-area').classList.add('hidden');
      document.getElementById('completion-box').classList.remove('hidden');
      document.getElementById('transfer-actions').classList.add('hidden');
      document.getElementById('completion-actions').classList.remove('hidden');
    }

    function onFilePicked(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      selectedFile = file;
      isCancelled = false;
      isSender = true;

      const code = generateSixDigitCode();
      const peerId = 'sendly-' + code;

      if (peer) {
        try { peer.destroy(); } catch (_) {}
      }

      peer = new Peer(peerId, PEER_CONFIG);

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        showToast('Network error: ' + (err.type || 'unknown'));
      });

      peer.on('open', () => {
        document.getElementById('display-code').innerText = code;
        showView('view-send');

        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        if (window.QRCode) {
          const shareUrl = `${window.location.origin}${window.location.pathname}?code=${code}`;
          new QRCode(qrContainer, {
            text: shareUrl,
            width: 160,
            height: 160,
            colorDark: '#000000',
            colorLight: '#ffffff'
          });
        }
      });

      peer.on('connection', (conn) => {
        if (activeConnection && activeConnection !== conn) {
          try { conn.close(); } catch (_) {}
          return;
        }

        activeConnection = conn;

        const onOpen = () => {
          if (!activeConnection || activeConnection !== conn || isCancelled) return;
          try {
            rawDataChannel = conn.dataChannel;
            rawDataChannel.binaryType = 'arraybuffer';
            setupRawSenderChannel(file);
          } catch (e) {
            console.error(e);
            showToast('Failed to initialize transfer channel.');
          }
        };

        if (conn.open) onOpen();
        else conn.on('open', onOpen);

        conn.on('close', () => {
          if (!isCancelled && targetStatusText !== 'Delivered') {
            showToast('Transfer disconnected.');
          }
        });
      });
    }

    function initReceiverPeer() {
      if (peer && !peer.destroyed) return;
      peer = new Peer(PEER_CONFIG);
      peer.on('error', (err) => {
        console.error('Receiver peer error:', err);
        showToast('Connection error: ' + (err.type || 'unknown'));
      });
    }

    async function connectWithCode(customCode = null) {
      let targetCode = customCode;
      if (!targetCode) {
        const inputs = document.querySelectorAll('.otp-input');
        targetCode = '';
        inputs.forEach(i => targetCode += i.value);
      }

      if (!/^\d{6}$/.test(targetCode)) return;

      isCancelled = false;
      const targetPeerId = 'sendly-' + targetCode;
      initTransferView('RECEIVING FILE', 'Connecting to sender...', 0);

      if (!peer || peer.destroyed) {
        initReceiverPeer();
      }

      const startConnection = () => {
        activeConnection = peer.connect(targetPeerId, { reliable: true });

        const onOpen = () => {
          if (!activeConnection || isCancelled) return;
          try {
            rawDataChannel = activeConnection.dataChannel;
            rawDataChannel.binaryType = 'arraybuffer';
            setupRawReceiverChannel();
          } catch (e) {
            console.error(e);
            showToast('Failed to open data channel.');
          }
        };

        if (activeConnection.open) onOpen();
        else activeConnection.on('open', onOpen);

        activeConnection.on('error', (err) => {
          console.error(err);
          targetStatusText = 'Connection failed.';
          renderTransferUI(true);
          showToast('Could not connect to peer.');
        });
      };

      if (peer && peer.open) startConnection();
      else if (peer) peer.once('open', startConnection);
    }

    function setupRawReceiverChannel() {
      let tempBatch = [];
      let tempBatchSize = 0;
      let blobBatches = [];
      let meta = null;
      let completed = false;

      currentBytesTransferred = 0;
      totalBytesToTransfer = 0;

      rawDataChannel.onmessage = (event) => {
        if (isCancelled || completed) return;
        const data = event.data;

        // Metadata handling
        if (typeof data === 'string') {
          let msg;
          try { msg = JSON.parse(data); } catch (_) { return; }

          if (msg.type === 'file-meta') {
            meta = msg;
            tempBatch = [];
            tempBatchSize = 0;
            blobBatches = [];
            currentBytesTransferred = 0;
            totalBytesToTransfer = meta.size || 0;

            initTransferView('RECEIVING FILE', 'Receiving file...', 0, meta.name, meta.size);

            try {
              rawDataChannel.send(JSON.stringify({ type: 'file-meta-ack' }));
            } catch (_) {}
          }

          if (msg.type === 'control-cancel') {
            showToast('Sender cancelled transfer.');
            cancelAndReset();
          }
          return;
        }

        if (!meta) return;

        // Binary chunk handling
        let chunkBytes = 0;
        if (data instanceof ArrayBuffer) {
          tempBatch.push(data);
          chunkBytes = data.byteLength;
        } else if (ArrayBuffer.isView(data)) {
          const slice = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
          tempBatch.push(slice);
          chunkBytes = data.byteLength;
        }

        tempBatchSize += chunkBytes;
        currentBytesTransferred += chunkBytes;

        // Off-heap partitioning: Commit to Blob every 8MB to keep JS Heap clean
        if (tempBatchSize >= RECEIVER_BATCH_SIZE) {
          blobBatches.push(new Blob(tempBatch));
          tempBatch = [];
          tempBatchSize = 0;
        }

        targetStatusText = currentBytesTransferred >= meta.size
          ? 'Saving file...'
          : 'Receiving file...';

        if (currentBytesTransferred >= meta.size) {
          completed = true;
          try { rawDataChannel.send(JSON.stringify({ type: 'file-done' })); } catch (_) {}

          if (tempBatch.length > 0) {
            blobBatches.push(new Blob(tempBatch));
            tempBatch = [];
          }

          const finalBatches = blobBatches;
          blobBatches = [];

          // Defer file download trigger slightly to free the message loop
          setTimeout(() => downloadFileFast(finalBatches, meta), 10);
        }
      };
    }

    function downloadFileFast(batches, meta) {
      if (isCancelled) return;
      targetStatusText = 'Saving to device...';
      renderTransferUI(true);

      try {
        const finalBlob = new Blob(batches, { type: meta.fileType || 'application/octet-stream' });
        batches.length = 0; // Immediate release

        const url = URL.createObjectURL(finalBlob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = meta.name || 'downloaded_file';
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          try { a.remove(); } catch (_) {}
          URL.revokeObjectURL(url);
        }, 40000);

        showTransferComplete();
      } catch (err) {
        console.error('File saving error:', err);
        targetStatusText = 'Save failed.';
        renderTransferUI(true);
        showToast('Storage write failed.');
      }
    }

    function setupRawSenderChannel(file) {
      initTransferView('SENDING FILE', 'Connecting to receiver...', 0, file.name, file.size);

      let started = false;
      let handshakeTimer = null;

      const sendMeta = () => {
        if (isCancelled || started) return;
        try {
          if (rawDataChannel && rawDataChannel.readyState === 'open') {
            rawDataChannel.send(JSON.stringify({
              type: 'file-meta',
              name: file.name,
              size: file.size,
              fileType: file.type || 'application/octet-stream'
            }));
          }
        } catch (_) {}
      };

      sendMeta();
      handshakeTimer = setInterval(sendMeta, 400);

      rawDataChannel.onmessage = (event) => {
        if (typeof event.data !== 'string') return;
        let msg;
        try { msg = JSON.parse(event.data); } catch (_) { return; }

        if (msg.type === 'file-meta-ack') {
          if (handshakeTimer) {
            clearInterval(handshakeTimer);
            handshakeTimer = null;
          }
          if (!started && !isCancelled) {
            started = true;
            pumpStreamMaximumSpeed(file).catch(err => {
              console.error('Send error:', err);
              if (!isCancelled) {
                targetStatusText = 'Transfer error.';
                renderTransferUI(true);
                showToast('Failed sending file.');
              }
            });
          }
        } else if (msg.type === 'file-done') {
          showTransferComplete();
        } else if (msg.type === 'control-cancel') {
          showToast('Receiver cancelled transfer.');
          cancelAndReset();
        }
      };
    }

    function waitForLowBuffer(dc, threshold) {
      if (!dc || dc.readyState !== 'open' || dc.bufferedAmount <= threshold) {
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        let timer = null;
        const cleanup = () => {
          if (timer) clearInterval(timer);
          try { dc.removeEventListener('bufferedamountlow', onLow); } catch (_) {}
        };
        const done = () => {
          cleanup();
          resolve();
        };
        const onLow = () => {
          if (dc.bufferedAmount <= threshold || dc.readyState !== 'open') done();
        };

        try { dc.addEventListener('bufferedamountlow', onLow); } catch (_) {}
        // Fallback polling in case the event is swallowed
        timer = setInterval(() => {
          if (!dc || dc.readyState !== 'open' || dc.bufferedAmount <= threshold) done();
        }, 15);
      });
    }

    async function pumpStreamMaximumSpeed(file) {
      if (!rawDataChannel || rawDataChannel.readyState !== 'open') return;

      currentBytesTransferred = 0;
      totalBytesToTransfer = file.size;
      targetStatusText = 'Sending file...';
      renderTransferUI(true);

      const dc = rawDataChannel;
      try {
        dc.bufferedAmountLowThreshold = SEND_LOW_WATER;
      } catch (_) {}

      let offset = 0;
      let chunkCount = 0;

      // Pipeline read-ahead to avoid disk I/O idling
      let nextOffset = Math.min(file.size, offset + CHUNK_SIZE);
      let nextBufferPromise = file.slice(offset, nextOffset).arrayBuffer();

      while (offset < file.size) {
        if (isCancelled || !rawDataChannel || rawDataChannel.readyState !== 'open') return;

        // Pacing backpressure to prevent bufferbloat
        if (dc.bufferedAmount >= SEND_HIGH_WATER) {
          await waitForLowBuffer(dc, SEND_LOW_WATER);
          if (isCancelled || dc.readyState !== 'open') return;
        }

        const buffer = await nextBufferPromise;
        const sent = buffer.byteLength;
        if (!sent) break;

        dc.send(buffer);
        offset += sent;
        currentBytesTransferred = offset;
        chunkCount++;

        // Read next slice immediately
        nextOffset = Math.min(file.size, offset + CHUNK_SIZE);
        if (offset < file.size) {
          nextBufferPromise = file.slice(offset, nextOffset).arrayBuffer();
        }

        // Asynchronous non-blocking slice: Give UI thread a breath every 32 chunks (~2MB)
        if (chunkCount % 32 === 0) {
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }

      targetStatusText = 'Finalizing with receiver...';
      renderTransferUI(true);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const autoCode = (urlParams.get('code') || '').replace(/\D/g, '');

      if (autoCode.length === 6) {
        openReceiveView();
        const inputs = document.querySelectorAll('.otp-input');
        autoCode.split('').forEach((d, idx) => {
          if (inputs[idx]) inputs[idx].value = d;
        });
        setTimeout(() => connectWithCode(autoCode), 120);
      }
    });
  </script>
</body>
