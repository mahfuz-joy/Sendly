<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sendly · Ultra P2P</title>
    <meta name="theme-color" content="#5b68f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Direct P2P file transfer - Fast, Encrypted, No servers." />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="card">
        <div id="toast" class="toast-msg" role="status" aria-live="polite" aria-atomic="true"></div>

        <!-- HOME VIEW -->
        <div id="view-home">
            <div class="brand-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                     stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
            </div>
            <h1 class="brand-name">Sendly</h1>
            <p class="tagline">Direct P2P · Ultra fast · Encrypted</p>
            <input type="file" id="hidden-file-input" multiple style="display: none;" />
            <button class="primary-btn" id="btn-send-files" aria-label="Send Files">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                     stroke-width="2.2" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Send Files
            </button>
            <button class="secondary-btn" id="btn-receive-files" aria-label="Receive File">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                     stroke-width="2.2" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                </svg>
                Receive File
            </button>
            <p class="footer-note">Direct end-to-end encrypted device transfer.</p>
        </div>

        <!-- SEND VIEW -->
        <div id="view-send" class="hidden">
            <div class="view-header">
                <button class="back-btn" id="btn-back-send" aria-label="Back">‹</button>
                <span class="header-title">SEND · SHARE CODE</span>
            </div>
            <div class="code-display-box">
                <span id="display-code" aria-label="Share code">------</span>
            </div>
            <div class="qr-wrapper">
                <div id="qrcode" role="img" aria-label="QR code for sharing"></div>
            </div>
            <div id="send-queue-preview" class="queue-list" role="list"></div>
            <button class="action-btn-outline" id="btn-copy-link" aria-label="Copy share link">Copy Link</button>
            <button class="cancel-btn" id="btn-cancel-send" aria-label="Cancel transfer">Cancel Transfer</button>
        </div>

        <!-- RECEIVE VIEW -->
        <div id="view-receive" class="hidden">
            <div class="view-header">
                <button class="back-btn" id="btn-back-receive" aria-label="Back">‹</button>
                <span class="header-title">RECEIVE · ENTER CODE</span>
            </div>
            <p class="input-instruction">ENTER 6-DIGIT CODE</p>
            <div class="otp-container" role="group" aria-label="6-digit code input">
                <input type="text" maxlength="1" class="otp-input" inputmode="numeric" aria-label="Code digit 1" />
                <input type="text" maxlength="1" class="otp-input" inputmode="numeric" aria-label="Code digit 2" />
                <input type="text" maxlength="1" class="otp-input" inputmode="numeric" aria-label="Code digit 3" />
                <input type="text" maxlength="1" class="otp-input" inputmode="numeric" aria-label="Code digit 4" />
                <input type="text" maxlength="1" class="otp-input" inputmode="numeric" aria-label="Code digit 5" />
                <input type="text" maxlength="1" class="otp-input" inputmode="numeric" aria-label="Code digit 6" />
            </div>
            <button id="btn-connect" class="primary-btn" disabled aria-label="Connect and receive file">
                Connect &amp; Receive
            </button>
            <button class="cancel-btn" id="btn-cancel-receive" aria-label="Cancel receive">Cancel</button>
        </div>

        <!-- TRANSFER VIEW -->
        <div id="view-transfer" class="hidden">
            <div class="view-header">
                <span id="transfer-screen-title" class="header-title">TRANSFERRING</span>
            </div>
            <div id="transfer-icon-area">
                <div class="file-meta-card">
                    <div class="file-icon-box">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                             stroke-width="2" aria-hidden="true">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                            <polyline points="13 2 13 9 20 9"></polyline>
                        </svg>
                    </div>
                    <div class="file-info-col">
                        <div id="meta-filename" class="file-name-text">filename.ext</div>
                        <div id="meta-filesize" class="file-size-text">0 MB</div>
                    </div>
                    <div id="meta-batch-pill" class="batch-pill hidden">1 / 1</div>
                </div>
            </div>

            <!-- Completion Box -->
            <div id="completion-box" class="hidden">
                <div class="success-badge">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                         stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h2 id="completion-title" style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">
                    Transfer Complete!
                </h2>
                <p id="completion-sub" style="font-size: 13px; color: #8b9bb4; margin-bottom: 20px;">
                    File saved directly to your device.
                </p>
            </div>

            <!-- Transfer HUD -->
            <div class="transfer-hud">
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" role="progressbar" aria-valuenow="0" aria-valuemin="0" 
                         aria-valuemax="100"></div>
                </div>
                <div class="progress-info">
                    <span id="transfer-status">Connecting…</span>
                    <span id="transfer-percentage" aria-live="polite">0%</span>
                </div>
                <div class="speed-info">
                    <span id="transfer-speed">0.0 MB/s</span>
                    <span id="transfer-eta">ETA: …</span>
                </div>
            </div>

            <div id="transfer-actions">
                <button class="cancel-btn" id="btn-cancel-transfer" style="margin-top: 4px;" 
                        aria-label="Cancel transfer">Cancel</button>
            </div>
            <div id="completion-actions" class="hidden">
                <button id="btn-send-more" class="primary-btn hidden" aria-label="Send more files">
                    Send More Files
                </button>
                <button class="secondary-btn" id="btn-done" style="margin-bottom: 0;" aria-label="Done">Done</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
