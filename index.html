  <!-- Generating dynamic app icon and web manifest -->
  <script>
    (function() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#6366f1');
      grad.addColorStop(1, '#4338ca');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(140, 246);
      ctx.lineTo(372, 140);
      ctx.lineTo(266, 372);
      ctx.lineTo(224, 288);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.beginPath();
      ctx.moveTo(372, 140);
      ctx.lineTo(224, 288);
      ctx.lineTo(252, 252);
      ctx.closePath();
      ctx.fill();

      const iconUrl = canvas.toDataURL('image/png');

      const fav = document.createElement('link');
      fav.rel = 'icon';
      fav.type = 'image/png';
      fav.href = iconUrl;
      document.head.appendChild(fav);

      const apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = iconUrl;
      document.head.appendChild(apple);

      const manifestObj = {
        name: 'Sendly',
        short_name: 'Sendly',
        start_url: './',
        display: 'standalone',
        background_color: '#0b0e14',
        theme_color: '#5b68f6',
        icons: [
          {
            src: iconUrl,
            sizes: '512x512',
            type: 'image/png',
            purpose: 'any maskable'
          }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(manifestBlob);
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = manifestUrl;
      document.head.appendChild(manifestLink);
    })();
  </script>

  <script>
    /*
      SENDLY — High Throughput / Low UI Jank transfer engine

      What changed from the original:
      - No requestAnimationFrame loop. UI is rendered at 5 FPS (not 60 FPS).
      - Much larger WebRTC send window with real bufferedAmount backpressure.
      - Adaptive chunk size based on the negotiated SCTP max message size.
      - One read-ahead buffer keeps disk/file reads from starving the data channel.
      - No per-chunk DOM updates, JSON parsing, or expensive layout work.
      - Receiver stores binary chunks only; Blob/download work is deferred until after
        the last network message handler returns.
      - Better cancel/error cleanup and protection against stale channel handlers.
      - The transfer remains RELIABLE; speed is improved by pacing the data channel
        instead of flooding it.
    */

    const PEER_CONFIG = {
      config: {
        // ICE will prefer a direct host/srflx path when possible.
        // TURN remains a fallback for networks that cannot establish P2P directly.
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun.relay.metered.ca:80' },
          { urls: 'turn:global.relay.metered.ca:80', username: '62588f777bbaaf306ef3f17f', credential: 'vCNtTXqhnEYquavX' },
          { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: '62588f777bbaaf306ef3f17f', credential: 'vCNtTXqhnEYquavX' },
          { urls: 'turn:global.relay.metered.ca:443', username: '62588f777bbaaf306ef3f17f', credential: 'vCNtTXqhnEYquavX' },
          { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: '62588f777bbaaf306ef3f17f', credential: 'vCNtTXqhnEYquavX' }
        ],
        sdpSemantics: 'unified-plan'
      }
    };

    let peer = null;
    let activeConnection = null;
    let rawDataChannel = null;
    let selectedFile = null;
    let isCancelled = false;
    let isSender = false;

    let currentBytesTransferred = 0;
    let totalBytesToTransfer = 0;

    // UI is intentionally low-frequency to keep transfers smooth.
    let uiTimer = null;
    let uiLastBytes = 0;
    let uiLastTime = 0;
    let speedEmaBps = 0;

    let displayPercent = 0;
    let targetStatusText = 'Connecting...';
    let targetEtaText = 'ETA: calculating...';

    const UI_INTERVAL_MS = 200;
    const SEND_HIGH_WATER = 12 * 1024 * 1024; // 12 MB
    const SEND_LOW_WATER = 3 * 1024 * 1024;  // 3 MB
    const DEFAULT_CHUNK_SIZE = 512 * 1024;   // 512 KB
    const MIN_CHUNK_SIZE = 64 * 1024;        // 64 KB
    const MAX_CHUNK_SIZE = 512 * 1024;       // 512 KB

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function generateSixDigitCode() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(k)), sizes.length - 1);
      return (bytes / Math.pow(k, i)).toFixed(i === 0 ? 0 : 1) + ' ' + sizes[i];
    }

    function showView(viewId) {
      ['view-home', 'view-send', 'view-receive', 'view-transfer'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
    }

    function setProgressPercent(percent) {
      const p = Math.max(0, Math.min(100, percent));
      const fill = document.getElementById('progress-bar-fill');
      const pct = document.getElementById('transfer-percentage');
      if (fill) fill.style.transform = `scaleX(${p / 100})`;
      if (pct) pct.innerText = Math.floor(p) + '%';
      displayPercent = p;
    }

    function renderTransferUI(force = false) {
      const now = performance.now();
      if (!force && uiLastTime && now - uiLastTime < UI_INTERVAL_MS) return;

      const dt = uiLastTime ? (now - uiLastTime) / 1000 : 0;
      const db = currentBytesTransferred - uiLastBytes;

      if (dt > 0) {
        const instant = Math.max(0, db / dt);
        // EMA avoids noisy speed values without touching the transfer itself.
        speedEmaBps = speedEmaBps === 0 ? instant : (speedEmaBps * 0.72 + instant * 0.28);
      }

      uiLastTime = now;
      uiLastBytes = currentBytesTransferred;

      const realPercent = totalBytesToTransfer > 0
        ? (currentBytesTransferred / totalBytesToTransfer) * 100
        : 0;

      setProgressPercent(targetStatusText === 'Delivered' ? 100 : Math.min(99.9, realPercent));

      const status = document.getElementById('transfer-status');
      const speed = document.getElementById('transfer-speed');
      const eta = document.getElementById('transfer-eta');

      if (status) status.innerText = targetStatusText;

      if (speed) {
        if (targetStatusText === 'Delivered') {
          speed.innerText = 'Complete';
        } else if (speedEmaBps >= 1024 * 1024) {
          speed.innerText = (speedEmaBps / (1024 * 1024)).toFixed(1) + ' MB/s';
        } else if (speedEmaBps >= 1024) {
          speed.innerText = (speedEmaBps / 1024).toFixed(0) + ' KB/s';
        } else {
          speed.innerText = '0 KB/s';
        }
      }

      if (eta) {
        if (targetStatusText === 'Delivered') {
          eta.innerText = '';
        } else if (speedEmaBps > 0 && totalBytesToTransfer > 0) {
          const remaining = Math.max(0, totalBytesToTransfer - currentBytesTransferred);
          const secs = Math.ceil(remaining / speedEmaBps);
          eta.innerText = secs > 0 ? `ETA: ${secs}s` : 'ETA: <1s';
        } else {
          eta.innerText = targetEtaText;
        }
      }
    }

    function startUiLoop() {
      stopUiLoop();
      uiLastBytes = currentBytesTransferred;
      uiLastTime = performance.now();
      speedEmaBps = 0;
      uiTimer = setInterval(() => {
        if (!isCancelled) renderTransferUI(false);
      }, UI_INTERVAL_MS);
      renderTransferUI(true);
    }

    function stopUiLoop() {
      if (uiTimer) {
        clearInterval(uiTimer);
        uiTimer = null;
      }
    }

    function cleanupChannel() {
      const dc = rawDataChannel;
      rawDataChannel = null;

      if (dc) {
        try {
          dc.onmessage = null;
          dc.onopen = null;
          dc.onclose = null;
          dc.onerror = null;
          dc.onbufferedamountlow = null;
          if (dc.readyState !== 'closed') dc.close();
        } catch (_) {}
      }
    }

    function cancelAndReset() {
      isCancelled = true;
      stopUiLoop();

      if (rawDataChannel && rawDataChannel.readyState === 'open') {
        try { rawDataChannel.send(JSON.stringify({ type: 'control-cancel' })); } catch (_) {}
      }

      cleanupChannel();

      if (activeConnection) {
        try { activeConnection.close(); } catch (_) {}
        activeConnection = null;
      }

      if (peer) {
        try { peer.destroy(); } catch (_) {}
        peer = null;
      }

      selectedFile = null;
      currentBytesTransferred = 0;
      totalBytesToTransfer = 0;
      displayPercent = 0;

      const input = document.getElementById('hidden-file-input');
      if (input) input.value = '';

      showView('view-home');
    }

    function sendAnotherFile() {
      cancelAndReset();
      setTimeout(() => document.getElementById('hidden-file-input').click(), 120);
    }

    function openReceiveView() {
      isSender = false;
      showView('view-receive');
      setupOtpInputs();
      if (!peer) initReceiverPeer();
    }

    function waitForPeerJs(timeoutMs = 12000) {
      return new Promise((resolve, reject) => {
        const start = performance.now();
        (function check() {
          if (window.Peer) return resolve();
          if (performance.now() - start >= timeoutMs) {
            reject(new Error('PeerJS library did not load.'));
            return;
          }
          setTimeout(check, 30);
        })();
      });
    }

    async function onFilePicked(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      selectedFile = file;
      isCancelled = false;
      isSender = true;

      try {
        await waitForPeerJs();
      } catch (e) {
        showToast('Connection library failed to load.');
        return;
      }

      const code = generateSixDigitCode();
      const peerId = 'sendly-' + code;

      if (peer) {
        try { peer.destroy(); } catch (_) {}
      }

      peer = new Peer(peerId, PEER_CONFIG);

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        showToast('Connection error: ' + (err.type || 'unknown'));
      });

      peer.on('open', () => {
        const codeEl = document.getElementById('display-code');
        codeEl.innerText = code;
        showView('view-send');

        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';

        if (window.QRCode) {
          const shareUrl = `${window.location.origin}${window.location.pathname}?code=${code}`;
          new QRCode(qrContainer, {
            text: shareUrl,
            width: 160,
            height: 160,
            colorDark: '#000000',
            colorLight: '#ffffff'
          });
        }
      });

      peer.on('connection', (conn) => {
        // Only one active file transfer at a time.
        if (activeConnection && activeConnection !== conn) {
          try { conn.close(); } catch (_) {}
          return;
        }

        activeConnection = conn;

        const onOpen = () => {
          if (!activeConnection || activeConnection !== conn || isCancelled) return;
          try {
            rawDataChannel = conn.dataChannel;
            rawDataChannel.binaryType = 'arraybuffer';
            setupRawSenderChannel(file);
          } catch (e) {
            console.error(e);
            showToast('Unable to start transfer.');
          }
        };

        if (conn.open) onOpen();
        else conn.on('open', onOpen);

        conn.on('error', (err) => {
          console.error('Data connection error:', err);
          showToast('Data channel error.');
        });

        conn.on('close', () => {
          if (!isCancelled && targetStatusText !== 'Delivered') {
            showToast('Connection closed.');
          }
        });
      });
    }

    function copyShareLink() {
      const code = document.getElementById('display-code').innerText;
      const shareUrl = `${window.location.origin}${window.location.pathname}?code=${code}`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shareUrl)
          .then(() => showToast('Share link copied!'))
          .catch(() => fallbackCopy(shareUrl));
      } else {
        fallbackCopy(shareUrl);
      }
    }

    function fallbackCopy(text) {
      const input = document.createElement('input');
      input.value = text;
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      try {
        document.execCommand('copy');
        showToast('Share link copied!');
      } catch (_) {
        showToast('Copy failed.');
      }
      input.remove();
    }

    function initReceiverPeer() {
      if (!window.Peer) {
        waitForPeerJs().then(initReceiverPeer).catch(() => showToast('Connection library failed to load.'));
        return;
      }

      peer = new Peer(PEER_CONFIG);
      peer.on('error', (err) => {
        console.error('Receiver peer error:', err);
        showToast('Network error: ' + (err.type || 'unknown'));
      });
    }

    function setupOtpInputs() {
      const inputs = document.querySelectorAll('.otp-input');

      inputs.forEach((input, idx) => {
        input.value = '';

        input.oninput = (e) => {
          e.target.value = e.target.value.replace(/\D/g, '').slice(0, 1);
          if (e.target.value && idx < inputs.length - 1) inputs[idx + 1].focus();
          checkOtpFilled();
        };

        input.onkeydown = (e) => {
          if (e.key === 'Backspace' && !e.target.value && idx > 0) {
            inputs[idx - 1].focus();
          }
        };

        input.onpaste = (e) => {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
          pasted.split('').forEach((digit, i) => {
            if (inputs[i]) inputs[i].value = digit;
          });
          checkOtpFilled();
          if (pasted.length === 6) inputs[5].focus();
        };
      });

      inputs[0].focus();
    }

    function checkOtpFilled() {
      const inputs = document.querySelectorAll('.otp-input');
      let fullCode = '';
      inputs.forEach(i => fullCode += i.value);
      document.getElementById('btn-connect').disabled = fullCode.length !== 6;
    }

    async function connectWithCode(customCode = null) {
      let targetCode = customCode;

      if (!targetCode) {
        const inputs = document.querySelectorAll('.otp-input');
        targetCode = '';
        inputs.forEach(i => targetCode += i.value);
      }

      if (!/^\d{6}$/.test(targetCode)) return;

      isCancelled = false;

      try {
        await waitForPeerJs();
      } catch (_) {
        showToast('Connection library failed to load.');
        return;
      }

      const targetPeerId = 'sendly-' + targetCode;
      initTransferView('RECEIVING FILE', 'Connecting to sender...', 0);

      if (!peer || peer.destroyed) {
        initReceiverPeer();
      }

      const startConnection = () => makeReceiverCall(targetPeerId);

      if (peer && peer.open) startConnection();
      else if (peer) peer.once('open', startConnection);
      else {
        showToast('Unable to initialize network.');
        cancelAndReset();
      }
    }

    function makeReceiverCall(targetPeerId) {
      activeConnection = peer.connect(targetPeerId, {
        reliable: true
      });

      const onOpen = () => {
        if (!activeConnection || isCancelled) return;

        try {
          rawDataChannel = activeConnection.dataChannel;
          rawDataChannel.binaryType = 'arraybuffer';
          setupRawReceiverChannel();
        } catch (e) {
          console.error(e);
          showToast('Unable to open data channel.');
        }
      };

      if (activeConnection.open) onOpen();
      else activeConnection.on('open', onOpen);

      activeConnection.on('error', (err) => {
        console.error('Receiver data connection error:', err);
        targetStatusText = 'Failed to connect.';
        renderTransferUI(true);
        showToast('Connection failed.');
      });
    }

    function initTransferView(title, statusText, percent, fileName = 'Connecting...', fileSize = 0) {
      showView('view-transfer');

      document.getElementById('transfer-screen-title').innerText = title;
      document.getElementById('meta-filename').innerText = fileName;
      document.getElementById('meta-filesize').innerText = formatBytes(fileSize);

      document.getElementById('transfer-icon-area').classList.remove('hidden');
      document.getElementById('completion-box').classList.add('hidden');
      document.getElementById('transfer-actions').classList.remove('hidden');
      document.getElementById('completion-actions').classList.add('hidden');

      currentBytesTransferred = Math.max(0, percent * fileSize / 100);
      totalBytesToTransfer = fileSize;
      targetStatusText = statusText;
      targetEtaText = 'ETA: calculating...';

      setProgressPercent(percent);
      startUiLoop();
    }

    function showTransferComplete() {
      targetStatusText = 'Delivered';
      targetEtaText = '';

      currentBytesTransferred = totalBytesToTransfer;
      setProgressPercent(100);
      renderTransferUI(true);
      stopUiLoop();

      document.getElementById('transfer-icon-area').classList.add('hidden');
      document.getElementById('completion-box').classList.remove('hidden');
      document.getElementById('transfer-actions').classList.add('hidden');
      document.getElementById('completion-actions').classList.remove('hidden');
    }

    function getOptimalChunkSize() {
      try {
        const pc = activeConnection && activeConnection.peerConnection;
        const maxMessage = pc && pc.sctp && pc.sctp.maxMessageSize;

        // maxMessageSize can be Infinity / 0 depending on browser.
        if (Number.isFinite(maxMessage) && maxMessage > 0) {
          // Keep a safety margin for SCTP implementations.
          return Math.max(
            MIN_CHUNK_SIZE,
            Math.min(MAX_CHUNK_SIZE, Math.floor(maxMessage * 0.75))
          );
        }
      } catch (_) {}
      return DEFAULT_CHUNK_SIZE;
    }

    function waitForBufferedAmountLow(dc, threshold) {
      if (!dc || dc.readyState !== 'open' || dc.bufferedAmount <= threshold) {
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        let settled = false;
        let pollTimer = null;

        const cleanup = () => {
          if (pollTimer) clearInterval(pollTimer);
          try { dc.removeEventListener('bufferedamountlow', onLow); } catch (_) {}
        };

        const finish = () => {
          if (settled) return;
          settled = true;
          cleanup();
          resolve();
        };

        const onLow = () => {
          if (dc.bufferedAmount <= threshold || dc.readyState !== 'open') finish();
        };

        try { dc.addEventListener('bufferedamountlow', onLow); } catch (_) {}

        // Safety fallback: some browsers can miss the low event around rapid
        // buffer transitions, so poll very lightly without blocking the UI.
        pollTimer = setInterval(() => {
          if (!dc || dc.readyState !== 'open' || dc.bufferedAmount <= threshold) finish();
        }, 20);
      });
    }

    function setupRawReceiverChannel() {
      let receivedChunks = [];
      let meta = null;
      let completed = false;

      currentBytesTransferred = 0;
      totalBytesToTransfer = 0;

      rawDataChannel.onmessage = (event) => {
        if (isCancelled || completed) return;

        const data = event.data;

        if (typeof data === 'string') {
          let msg;
          try { msg = JSON.parse(data); } catch (_) { return; }

          if (msg.type === 'file-meta') {
            meta = msg;
            receivedChunks = [];
            currentBytesTransferred = 0;
            totalBytesToTransfer = meta.size || 0;

            initTransferView(
              'RECEIVING FILE',
              'Receiving file...',
              0,
              meta.name || 'file',
              meta.size || 0
            );

            try {
              rawDataChannel.send(JSON.stringify({ type: 'file-meta-ack' }));
            } catch (_) {}
          }

          if (msg.type === 'control-cancel') {
            showToast('Sender cancelled the transfer.');
            cancelAndReset();
          }

          return;
        }

        if (!meta) return;

        // PeerJS normally delivers ArrayBuffer when binaryType is arraybuffer.
        // Blob is handled as a safety fallback.
        if (data instanceof ArrayBuffer) {
          receivedChunks.push(data);
          currentBytesTransferred += data.byteLength;
        } else if (data instanceof Blob) {
          receivedChunks.push(data);
          currentBytesTransferred += data.size;
        } else if (ArrayBuffer.isView(data)) {
          const copy = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
          receivedChunks.push(copy);
          currentBytesTransferred += data.byteLength;
        } else {
          return;
        }

        targetStatusText = currentBytesTransferred >= meta.size
          ? 'Saving to device...'
          : 'Receiving...';

        // Do not create the final Blob inside the message event. Let the event
        // queue drain first so the renderer/network stack gets breathing room.
        if (currentBytesTransferred >= meta.size) {
          completed = true;

          try { rawDataChannel.send(JSON.stringify({ type: 'file-done' })); } catch (_) {}

          const parts = receivedChunks;
          receivedChunks = [];

          setTimeout(() => saveReceivedFile(parts, meta), 0);
        }
      };
    }

    async function saveReceivedFile(parts, meta) {
      if (isCancelled) return;

      targetStatusText = 'Saving to device...';
      renderTransferUI(true);

      try {
        // Blob construction is done after the receive message handler returns.
        const blob = new Blob(parts, {
          type: meta.fileType || 'application/octet-stream'
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = meta.name || 'download';
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          try { a.remove(); } catch (_) {}
          URL.revokeObjectURL(url);
        }, 60000);

        // Release references as early as possible.
        parts.length = 0;
        showTransferComplete();
      } catch (e) {
        console.error('Save error:', e);
        targetStatusText = 'Save failed.';
        renderTransferUI(true);
        showToast('Could not save the received file.');
      }
    }

    function setupRawSenderChannel(file) {
      initTransferView(
        'SENDING FILE',
        'Connecting to receiver...',
        0,
        file.name,
        file.size
      );

      let started = false;
      let handshakeTimer = null;

      const sendMeta = () => {
        if (isCancelled || started) return;

        try {
          if (rawDataChannel && rawDataChannel.readyState === 'open') {
            rawDataChannel.send(JSON.stringify({
              type: 'file-meta',
              name: file.name,
              size: file.size,
              fileType: file.type || 'application/octet-stream'
            }));
          }
        } catch (_) {}
      };

      sendMeta();
      handshakeTimer = setInterval(sendMeta, 500);

      rawDataChannel.onmessage = (event) => {
        if (typeof event.data !== 'string') return;

        let msg;
        try { msg = JSON.parse(event.data); } catch (_) { return; }

        if (msg.type === 'file-meta-ack') {
          if (handshakeTimer) {
            clearInterval(handshakeTimer);
            handshakeTimer = null;
          }

          if (!started && !isCancelled) {
            started = true;
            pumpStreamMaximumThroughput(file).catch((err) => {
              console.error('Send error:', err);
              if (!isCancelled) {
                targetStatusText = 'Transfer failed.';
                renderTransferUI(true);
                showToast('Transfer failed.');
              }
            });
          }
        } else if (msg.type === 'file-done') {
          showTransferComplete();
        } else if (msg.type === 'control-cancel') {
          showToast('Receiver cancelled the transfer.');
          cancelAndReset();
        }
      };
    }

    async function pumpStreamMaximumThroughput(file) {
      if (!rawDataChannel || rawDataChannel.readyState !== 'open') return;

      currentBytesTransferred = 0;
      totalBytesToTransfer = file.size;
      targetStatusText = 'Sending file...';
      renderTransferUI(true);

      const dc = rawDataChannel;
      const chunkSize = getOptimalChunkSize();

      try {
        dc.bufferedAmountLowThreshold = SEND_LOW_WATER;
      } catch (_) {}

      let offset = 0;

      // Read ahead one chunk while the previous chunk is being sent.
      let nextOffset = Math.min(file.size, offset + chunkSize);
      let nextBufferPromise = file.slice(offset, nextOffset).arrayBuffer();

      while (offset < file.size) {
        if (isCancelled || !rawDataChannel || rawDataChannel.readyState !== 'open') return;

        // Backpressure: wait only when the browser's SCTP buffer is genuinely full.
        if (dc.bufferedAmount >= SEND_HIGH_WATER) {
          await waitForBufferedAmountLow(dc, SEND_LOW_WATER);
          if (isCancelled || dc.readyState !== 'open') return;
        }

        const buffer = await nextBufferPromise;
        const sentBytes = buffer.byteLength;
        if (!sentBytes) break;

        dc.send(buffer);
        offset += sentBytes;
        currentBytesTransferred = offset;

        // Start reading the next slice immediately. This overlaps file I/O with
        // network draining without ever loading the whole file into RAM.
        nextOffset = Math.min(file.size, offset + chunkSize);
        if (offset < file.size) {
          nextBufferPromise = file.slice(offset, nextOffset).arrayBuffer();
        }

        // Occasionally return control to the event loop. This is intentionally
        // infrequent; too many yields reduce throughput on fast Wi-Fi.
        if ((offset / chunkSize) % 32 === 0) {
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }

      targetStatusText = 'Waiting for receiver...';
      renderTransferUI(true);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const autoCode = (urlParams.get('code') || '').replace(/\D/g, '');

      if (autoCode.length === 6) {
        openReceiveView();

        const inputs = document.querySelectorAll('.otp-input');
        autoCode.split('').forEach((digit, idx) => {
          if (inputs[idx]) inputs[idx].value = digit;
        });

        // Delay very slightly so the deferred PeerJS library has a chance to load.
        setTimeout(() => connectWithCode(autoCode), 80);
      }
    });
  </script>
</body>
</html>
